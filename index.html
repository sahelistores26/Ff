<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Fire Tournament Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // -------------------------------------------------------------
    // Firebase Configuration
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyD_Eq2J6xC4aclpAoaOwI_eXkxCsIt-fQI",
      authDomain: "ff-tournament-101ba.firebaseapp.com",
      projectId: "ff-tournament-101ba",
      storageBucket: "ff-tournament-101ba.firebasestorage.app",
      messagingSenderId: "322986026316",
      appId: "1:322986026316:web:f6d641620d5b0c5e665be9",
      measurementId: "G-YC0MF0VR9J"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function App() {
      // User Auth State
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('register'); // Default register page on first open

      // Form Inputs
      const [registerPhone, setRegisterPhone] = useState('');
      const [registerPassword, setRegisterPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loginPhone, setLoginPhone] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      // UI View States
      const [currentTab, setCurrentTab] = useState('tournaments');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);

      // Data States
      const [tournaments, setTournaments] = useState([]);
      const [depositRequests, setDepositRequests] = useState([]);
      const [withdrawalRequests, setWithdrawalRequests] = useState([]);
      const [registeredUsersList, setRegisteredUsersList] = useState([]);
      const [qrCodeUrl, setQrCodeUrl] = useState('https://i.ibb.co/L8r3q3K/phonepe-qr.jpg');

      // Modals
      const [showDepositModal, setShowDepositModal] = useState(false);
      const [showWithdrawModal, setShowWithdrawModal] = useState(false);
      const [depositAmount, setDepositAmount] = useState('');
      const [utrNumber, setUtrNumber] = useState('');
      const [withdrawAmount, setWithdrawAmount] = useState('');
      const [withdrawUpi, setWithdrawUpi] = useState('');

      // New Match Form State
      const [newMatch, setNewMatch] = useState({
        title: 'Bermuda Battle Royale',
        type: 'SOLO',
        fee: 50,
        prize: 500,
        perKill: 10,
        time: '7:00 PM Today',
        slotsTotal: 48,
        roomId: '',
        roomPass: ''
      });

      // -------------------------------------------------------------
      // Real-Time Firebase Listeners
      // -------------------------------------------------------------
      useEffect(() => {
        const unsubTournaments = db.collection('tournaments').onSnapshot((snapshot) => {
          setTournaments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubDeposits = db.collection('deposits').onSnapshot((snapshot) => {
          setDepositRequests(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubWithdrawals = db.collection('withdrawals').onSnapshot((snapshot) => {
          setWithdrawalRequests(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubUsers = db.collection('users').onSnapshot((snapshot) => {
          const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRegisteredUsersList(docs);
          
          if (currentUser) {
            const updatedMe = docs.find(u => u.phone === currentUser.phone);
            if (updatedMe) setCurrentUser(updatedMe);
          }
        });

        const unsubQR = db.collection('settings').doc('global_qr').onSnapshot((doc) => {
          if (doc.exists && doc.data().url) {
            setQrCodeUrl(doc.data().url);
          }
        });

        return () => {
          unsubTournaments();
          unsubDeposits();
          unsubWithdrawals();
          unsubUsers();
          unsubQR();
        };
      }, [currentUser?.phone]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // -------------------------------------------------------------
      // Upgraded Auth Handlers
      // -------------------------------------------------------------
      const handleRegister = async (e) => {
        e.preventDefault();
        
        if (!registerPhone || !registerPassword || !confirmPassword) {
          alert('Kripya saari details bhariye!');
          return;
        }

        if (registerPassword !== confirmPassword) {
          alert('Password aur Confirm Password match nahi ho rahe hain!');
          return;
        }

        const userRef = db.collection('users').doc(registerPhone);
        const doc = await userRef.get();

        if (doc.exists) {
          alert('Number already registered!');
          return;
        }

        const sysUid = 'FF-' + Math.floor(10000 + Math.random() * 90000);
        const newUser = {
          phone: registerPhone,
          password: registerPassword,
          systemUid: sysUid,
          wallet: 0,
          joinedMatches: [],
          status: 'online',
          createdAt: new Date().toISOString()
        };

        await userRef.set(newUser);
        alert('Registration Success!');
        
        // Auto-switch to login page and prepopulate phone number
        setLoginPhone(registerPhone);
        setRegisterPassword('');
        setConfirmPassword('');
        setAuthMode('login');
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        
        if (!loginPhone || !loginPassword) {
          alert('Kripya mobile number aur password dono bhariye!');
          return;
        }

        const doc = await db.collection('users').doc(loginPhone).get();

        if (!doc.exists) {
          alert('Number not registered!');
          setAuthMode('register'); // Automatically open register page
          setRegisterPhone(loginPhone);
          return;
        }

        const userData = doc.data();
        if (userData.password !== loginPassword) {
          alert('Wrong password!');
          return;
        }

        // Correct credentials -> Open Home Page directly
        setCurrentUser(userData);
      };

      // -------------------------------------------------------------
      // Admin Lock Logic
      // -------------------------------------------------------------
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'Raunak7714') {
          alert('Access Granted! Welcome Admin.');
          setIsAdminLoggedIn(true);
          setShowAdminLoginModal(false);
          setCurrentTab('admin');
          setAdminPasswordInput('');
        } else {
          alert('Access Denied!');
          setAdminPasswordInput('');
        }
      };

      const handleSwitchTab = (tab) => {
        if (tab === 'admin' && !isAdminLoggedIn) {
          setShowAdminLoginModal(true);
        } else {
          if (currentTab === 'admin' && tab !== 'admin') {
            setIsAdminLoggedIn(false);
          }
          setCurrentTab(tab);
        }
      };

      // -------------------------------------------------------------
      // Wallet Actions
      // -------------------------------------------------------------
      const handleDepositSubmit = async (e) => {
        e.preventDefault();
        if (!depositAmount || !utrNumber) {
          alert('Amount aur UTR number daalein!');
          return;
        }

        await db.collection('deposits').add({
          userPhone: currentUser.phone,
          userUid: currentUser.systemUid,
          amount: Number(depositAmount),
          utr: utrNumber,
          status: 'pending',
          timestamp: new Date().toISOString()
        });

        alert('Deposit Request Sent! Admin verify karke wallet me balance add karega.');
        setShowDepositModal(false);
        setDepositAmount('');
        setUtrNumber('');
      };

      const handleWithdrawSubmit = async (e) => {
        e.preventDefault();
        const amt = Number(withdrawAmount);
        if (!amt || !withdrawUpi) {
          alert('Amount aur UPI ID daalein!');
          return;
        }

        if (currentUser.wallet < amt) {
          alert('Insufficent balance!');
          return;
        }

        await db.collection('withdrawals').add({
          userPhone: currentUser.phone,
          userUid: currentUser.systemUid,
          amount: amt,
          upi: withdrawUpi,
          status: 'pending',
          timestamp: new Date().toISOString()
        });

        alert('Withdrawal Request Sent!');
        setShowWithdrawModal(false);
        setWithdrawAmount('');
        setWithdrawUpi('');
      };

      // -------------------------------------------------------------
      // Admin Operations
      // -------------------------------------------------------------
      const handleApproveDeposit = async (req) => {
        const userRef = db.collection('users').doc(req.userPhone);
        await db.runTransaction(async (transaction) => {
          const userDoc = await transaction.get(userRef);
          if (userDoc.exists) {
            const newBal = (userDoc.data().wallet || 0) + req.amount;
            transaction.update(userRef, { wallet: newBal });
          }
        });
        await db.collection('deposits').doc(req.id).update({ status: 'approved' });
        alert(`Deposit Approved! ₹${req.amount} added.`);
      };

      const handleRejectDeposit = async (reqId) => {
        await db.collection('deposits').doc(reqId).update({ status: 'rejected' });
        alert('Deposit Request Rejected!');
      };

      const handleAddTournament = async (e) => {
        e.preventDefault();
        await db.collection('tournaments').add({
          ...newMatch,
          fee: Number(newMatch.fee),
          prize: Number(newMatch.prize),
          perKill: Number(newMatch.perKill),
          slotsTotal: Number(newMatch.slotsTotal),
          slotsFilled: 0,
          status: 'UPCOMING',
          joinedUsers: []
        });
        alert('Tournament Published!');
      };

      const handleRemoveTournament = async (id) => {
        if (confirm('Tournament delete karein?')) {
          await db.collection('tournaments').doc(id).delete();
          alert('Tournament Deleted!');
        }
      };

      const handleQRUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = async () => {
            await db.collection('settings').doc('global_qr').set({ url: reader.result });
            alert('Deposit QR globally updated!');
          };
          reader.readAsDataURL(file);
        }
      };

      // -------------------------------------------------------------
      // Render First-Time Registration / Login Screens
      // -------------------------------------------------------------
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-white">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
              <div className="text-center mb-6">
                <div className="inline-flex p-3 bg-orange-600/20 text-orange-500 rounded-xl mb-3">
                  <i data-lucide="gamepad-2" className="w-8 h-8"></i>
                </div>
                <h1 className="text-2xl font-bold tracking-wide text-orange-500">FREE FIRE TOURNAMENTS</h1>
                <p className="text-xs text-slate-400 mt-1">Play, Win & Earn Real Money Rewards</p>
              </div>

              {/* Mode Switch Bar */}
              <div className="flex bg-slate-800/60 p-1 rounded-xl mb-6">
                <button
                  onClick={() => setAuthMode('register')}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${
                    authMode === 'register' ? 'bg-orange-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Register
                </button>
                <button
                  onClick={() => setAuthMode('login')}
                  className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${
                    authMode === 'login' ? 'bg-orange-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Login
                </button>
              </div>

              {authMode === 'register' ? (
                <form onSubmit={handleRegister} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-1">Mobile Number</label>
                    <input
                      type="text"
                      placeholder="Enter Mobile Number"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"
                      value={registerPhone}
                      onChange={(e) => setRegisterPhone(e.target.value)}
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-1">Password</label>
                    <input
                      type="password"
                      placeholder="Enter Password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"
                      value={registerPassword}
                      onChange={(e) => setRegisterPassword(e.target.value)}
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-1">Confirm Password</label>
                    <input
                      type="password"
                      placeholder="Re-enter Password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-orange-600 hover:bg-orange-500 font-bold py-3 rounded-xl transition-all shadow-lg shadow-orange-600/30 text-sm mt-2"
                  >
                    REGISTER
                  </button>
                </form>
              ) : (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-1">Mobile Number</label>
                    <input
                      type="text"
                      placeholder="Enter Registered Mobile Number"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"
                      value={loginPhone}
                      onChange={(e) => setLoginPhone(e.target.value)}
                      required
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 font-medium block mb-1">Password</label>
                    <input
                      type="password"
                      placeholder="Enter Password"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      required
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-orange-600 hover:bg-orange-500 font-bold py-3 rounded-xl transition-all shadow-lg shadow-orange-600/30 text-sm mt-2"
                  >
                    LOGIN
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // -------------------------------------------------------------
      // Render Website Home Page & Dashboard
      // -------------------------------------------------------------
      return (
        <div className="min-h-screen bg-slate-950 pb-24 text-white">
          {/* Top Bar */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-2 bg-orange-600 rounded-xl shadow-lg shadow-orange-600/30">
                <i data-lucide="trophy" className="w-5 h-5 text-white"></i>
              </div>
              <div>
                <h1 className="font-black tracking-wide text-white text-base leading-tight">FF ESPORTS</h1>
                <p className="text-[10px] text-slate-400 font-semibold">UID: {currentUser.systemUid}</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => handleSwitchTab('wallet')}
                className="bg-slate-800 border border-slate-700/60 px-3 py-1.5 rounded-full flex items-center space-x-2 hover:border-orange-500/50 transition-all"
              >
                <i data-lucide="wallet" className="w-4 h-4 text-orange-500"></i>
                <span className="text-xs font-bold text-emerald-400">₹{currentUser.wallet || 0}</span>
              </button>

              <button
                onClick={() => handleSwitchTab('admin')}
                className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all border ${
                  isAdminLoggedIn
                    ? 'bg-red-600/20 text-red-400 border-red-500'
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-orange-500'
                }`}
              >
                {isAdminLoggedIn ? 'Admin Active' : 'Admin'}
              </button>
            </div>
          </header>

          <main className="max-w-xl mx-auto p-4">
            {/* Tournaments Tab */}
            {currentTab === 'tournaments' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold tracking-wide flex items-center text-slate-200">
                    <i data-lucide="flame" className="w-5 h-5 text-orange-500 mr-2"></i> Active Tournaments
                  </h2>
                  <span className="text-xs text-slate-500">{tournaments.length} Available</span>
                </div>

                {tournaments.length === 0 ? (
                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-sm">
                    Koi active tournament nahi hai.
                  </div>
                ) : (
                  tournaments.map((match) => (
                    <div key={match.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 relative overflow-hidden shadow-xl">
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-1 bg-orange-600/20 text-orange-400 border border-orange-500/30 text-[10px] font-bold rounded-lg uppercase tracking-wider">
                          {match.type} • {match.status}
                        </span>
                        <span className="text-xs font-semibold text-slate-400 flex items-center">
                          <i data-lucide="clock" className="w-3.5 h-3.5 mr-1 text-slate-500"></i> {match.time}
                        </span>
                      </div>

                      <h3 className="font-bold text-base text-white mb-3">{match.title}</h3>

                      <div className="grid grid-cols-3 gap-2 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 mb-4 text-center">
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-semibold">Prize Pool</p>
                          <p className="text-sm font-black text-emerald-400">₹{match.prize}</p>
                        </div>
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-semibold">Per Kill</p>
                          <p className="text-sm font-black text-orange-400">₹{match.perKill}</p>
                        </div>
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-semibold">Entry Fee</p>
                          <p className="text-sm font-black text-white">₹{match.fee}</p>
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-1">
                        <span className="text-xs text-slate-400 font-medium">
                          Slots: <span className="text-white font-bold">{match.slotsFilled || 0} / {match.slotsTotal}</span>
                        </span>
                        <button className="bg-orange-600 hover:bg-orange-500 font-bold px-5 py-2 rounded-xl text-xs transition-all shadow-lg shadow-orange-600/20">
                          JOIN MATCH
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* Wallet Tab */}
            {currentTab === 'wallet' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-slate-900 to-slate-900/90 border border-slate-800 rounded-2xl p-6 text-center relative shadow-2xl">
                  <p className="text-xs text-slate-400 uppercase font-bold tracking-wider mb-1">Available Wallet Balance</p>
                  <h2 className="text-4xl font-black text-emerald-400 tracking-tight">₹{currentUser.wallet || 0}</h2>

                  <div className="flex space-x-3 mt-6">
                    <button
                      onClick={() => setShowDepositModal(true)}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs tracking-wider transition-all shadow-lg shadow-emerald-600/20"
                    >
                      ADD MONEY
                    </button>
                    <button
                      onClick={() => setShowWithdrawModal(true)}
                      className="flex-1 bg-orange-600 hover:bg-orange-500 font-bold py-3 rounded-xl text-xs tracking-wider transition-all shadow-lg shadow-orange-600/20"
                    >
                      WITHDRAW
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Profile Tab */}
            {currentTab === 'profile' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-xl">
                  <div className="w-20 h-20 bg-orange-600/20 text-orange-500 border border-orange-500/30 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="user" className="w-10 h-10"></i>
                  </div>
                  <h2 className="text-lg font-bold text-white">{currentUser.phone}</h2>
                  <p className="text-xs text-slate-400 font-mono mt-0.5">System UID: {currentUser.systemUid}</p>

                  <button
                    onClick={() => { setCurrentUser(null); setAuthMode('login'); }}
                    className="mt-6 w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-bold py-2.5 rounded-xl text-xs transition-all"
                  >
                    LOGOUT
                  </button>
                </div>
              </div>
            )}

            {/* Admin Panel Tab */}
            {currentTab === 'admin' && isAdminLoggedIn && (
              <div className="space-y-6">
                <div className="bg-red-950/30 border border-red-500/30 rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-red-400">SUPER ADMIN CONTROL PANEL</h2>
                    <p className="text-[10px] text-slate-400">Real-time Data Active</p>
                  </div>
                  <button
                    onClick={() => { setIsAdminLoggedIn(false); setCurrentTab('tournaments'); }}
                    className="bg-red-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-lg"
                  >
                    EXIT ADMIN
                  </button>
                </div>

                {/* Deposit QR Code Manager */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold text-orange-400 uppercase tracking-wider">Deposit QR Code Manager</h3>
                  <div className="flex items-center space-x-4">
                    <img src={qrCodeUrl} alt="QR Code" className="w-20 h-20 rounded-xl bg-white p-1 border border-slate-700 object-contain" />
                    <div className="flex-1 space-y-2">
                      <label className="block text-[10px] text-slate-400 font-semibold">Upload New QR from Gallery</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleQRUpload}
                        className="text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500"
                      />
                    </div>
                  </div>
                </div>

                {/* Pending Deposit Verification Queue */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Pending Deposits</h3>
                  {depositRequests.filter(d => d.status === 'pending').map(req => (
                    <div key={req.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-white">Amount: ₹{req.amount}</p>
                        <p className="text-[10px] text-slate-400">User: {req.userPhone}</p>
                        <p className="text-[10px] text-slate-400">UTR: <span className="font-mono text-orange-400">{req.utr}</span></p>
                      </div>
                      <div className="flex space-x-2">
                        <button onClick={() => handleApproveDeposit(req)} className="bg-emerald-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-lg">Approve</button>
                        <button onClick={() => handleRejectDeposit(req.id)} className="bg-red-600 text-white font-bold text-[10px] px-3 py-1.5 rounded-lg">Reject</button>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Registered Users List */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Registered Users ({registeredUsersList.length})</h3>
                  <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                    {registeredUsersList.map(u => (
                      <div key={u.phone} className="p-2.5 bg-slate-950 rounded-xl border border-slate-800/80 text-xs flex justify-between items-center">
                        <div>
                          <p className="font-bold text-white">{u.phone} <span className="text-[10px] text-slate-500">({u.systemUid})</span></p>
                          <p className="text-[10px] text-slate-400">Pass: <span className="text-orange-400 font-mono">{u.password}</span></p>
                        </div>
                        <span className="font-bold text-emerald-400">₹{u.wallet || 0}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Deposit Modal */}
          {showDepositModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sm text-white">Deposit Money (PhonePe / UPI)</h3>
                  <button onClick={() => setShowDepositModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="text-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <img src={qrCodeUrl} alt="Deposit QR" className="w-44 h-44 mx-auto rounded-lg bg-white p-1 mb-2 object-contain" />
                  <p className="text-[11px] font-bold text-orange-400">KARN COMPUTER CENTER</p>
                  <p className="text-[10px] text-slate-500">Scan & Pay via UPI</p>
                </div>

                <form onSubmit={handleDepositSubmit} className="space-y-3">
                  <input
                    type="number"
                    placeholder="Enter Amount (₹)"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white"
                    value={depositAmount}
                    onChange={(e) => setDepositAmount(e.target.value)}
                    required
                  />
                  <input
                    type="text"
                    placeholder="Enter 12-digit UTR Number"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white font-mono"
                    value={utrNumber}
                    onChange={(e) => setUtrNumber(e.target.value)}
                    required
                  />
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs">
                    SUBMIT DEPOSIT PROOF
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Admin Verification Modal */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 space-y-4 shadow-2xl text-center">
                <div className="p-3 bg-red-600/20 text-red-500 rounded-xl inline-block">
                  <i data-lucide="shield-alert" className="w-8 h-8"></i>
                </div>
                <h3 className="font-bold text-sm text-white">Super Admin Verification</h3>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input
                    type="password"
                    placeholder="Enter Secret Password"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white text-center focus:outline-none focus:border-red-500"
                    value={adminPasswordInput}
                    onChange={(e) => setAdminPasswordInput(e.target.value)}
                    required
                  />
                  <div className="flex space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowAdminLoginModal(false)}
                      className="flex-1 bg-slate-800 py-2.5 rounded-xl text-xs font-bold text-slate-400"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg shadow-red-600/30"
                    >
                      Unlock
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800/80 py-2.5 px-6 z-40">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <button onClick={() => handleSwitchTab('tournaments')} className={`flex flex-col items-center space-y-1 ${currentTab === 'tournaments' ? 'text-orange-500' : 'text-slate-500'}`}>
                <i data-lucide="trophy" className="w-5 h-5"></i>
                <span className="text-[10px] font-bold">Matches</span>
              </button>
              <button onClick={() => handleSwitchTab('wallet')} className={`flex flex-col items-center space-y-1 ${currentTab === 'wallet' ? 'text-orange-500' : 'text-slate-500'}`}>
                <i data-lucide="wallet" className="w-5 h-5"></i>
                <span className="text-[10px] font-bold">Wallet</span>
              </button>
              <button onClick={() => handleSwitchTab('profile')} className={`flex flex-col items-center space-y-1 ${currentTab === 'profile' ? 'text-orange-500' : 'text-slate-500'}`}>
                <i data-lucide="user" className="w-5 h-5"></i>
                <span className="text-[10px] font-bold">Profile</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
